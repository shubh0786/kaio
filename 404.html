<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kaio — food safety, sorted.</title>
    <script>
      // GitHub Pages fallback: redirect any unknown path under /kaio/ back to the
      // app shell. Hash routing handles the rest client-side (no deep-link 404s).
      (function () {
        var l = window.location;
        var base = l.pathname.split('/').slice(0, 2).join('/') + '/';
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>

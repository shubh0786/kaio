    <script type="text/javascript">
      // Restore deep links after GitHub Pages 404 redirect
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded.slice(1) + l.hash);
        }
      }(window.location));
    </script>
